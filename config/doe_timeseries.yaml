# ======================================================================
# DOE spec for the time-series Adaptive NVAR pipeline.
#
# This spec mirrors the Mackey-Glass Adaptive NVAR notebooks using real
# validation-based runtime Optuna HPO inside the time-series child job.
# Optuna selects k, hidden_dim, lr_adam, and lr_lbfgs on validation RMSE@100;
# the selected configuration is then evaluated with repeated final tests.
#
# Generate concrete case configs:
#   python scripts/generate_doe.py --doe config/doe_timeseries.yaml
# ======================================================================

dataset:
  name: mackey_glass
  profile: ts_forecast
  task_type: regression
  source:
    type: local_npy
    path: data/ground_truth.npy
    time_axis: cols
  split:
    warmup_len: 500
    train_len: 7500
    val_len: 1000
    test_len: 1000

defaults:
  global.task_type: regression
  global.random_state: 2025
  global.base_dir: artifacts/data/doe_timeseries_{timestamp}
  global.run_dir: artifacts/runs/doe_timeseries_{timestamp}
  pipeline.feature_input: none
  train.tuning.method: optuna
  train.tuning.n_trials: 20
  train.tuning.trial_epoch_cap: 50
  train.tuning.seed: 2025
  train.tuning.direction: minimize
  train.tuning.metric: rmse_h100
  train.tuning.params.k: {type: categorical, choices: [2, 10, 30, 50]}
  train.tuning.params.hidden_dim: {type: categorical, choices: [10, 20, 50, 100, 200, 500, 1000]}
  train.tuning.params.lr_adam: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
  train.tuning.params.lr_lbfgs: {type: float, low: 0.1, high: 1.0, log: false}
  train.model.type: dl_adaptive_nvar
  train.model.params.weight_decay: 0.0
  train.model.params.num_windows: 10
  train.model.params.horizons: [25, 50, 75, 100]
  train.model.params.test_num_runs: 10
  train.model.params.selection_segment: val
  train.model.params.adam_patience: 200
  train.model.params.lbfgs_patience: 200
  train.model.params.max_epochs_adam: 50
  train.model.params.num_epochs_lbfgs: 50
  train.model.params.device: auto

# Scientific factors for the notebook cases.
#   - dataset_noise_scale: measurement noise added globally.
#   - train_noise_scale:   training-time perturbation on the train segment.
search_space:
  train.model.params.dataset_noise_scale: [0.0, 0.10, 0.20, 0.30]
  train.model.params.train_noise_scale: [0.05, 0.0]

constraints:
  allowed_combinations:
    - train.model.params.dataset_noise_scale: 0.0
      train.model.params.train_noise_scale: 0.05
    - train.model.params.dataset_noise_scale: 0.10
      train.model.params.train_noise_scale: 0.0
    - train.model.params.dataset_noise_scale: 0.20
      train.model.params.train_noise_scale: 0.0
    - train.model.params.dataset_noise_scale: 0.30
      train.model.params.train_noise_scale: 0.0

selection:
  max_cases: null

output:
  dir: doe/doe_timeseries_{timestamp}
